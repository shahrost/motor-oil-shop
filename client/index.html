<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f1b2d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO و پیش‌نمایش لینک: ثابت در HTML چون ربات‌های تلگرام/واتساپ/ایتا/بله جاوااسکریپت اجرا نمی‌کنن.
         عنوان و توضیح هر صفحه بعد از لود با common/PageMeta عوض می‌شه -->
    <title>شهرام روغن | فروش عمده روغن موتور و روانکار</title>
    <meta name="description" content="تأمین و فروش عمده‌ی روغن موتور، فیلتر، اسپری‌جات و اکتان برای فروشگاه‌های لوازم یدکی و اتوسرویس‌ها، با امکان پرداخت نقدی و چکی." />
    <link rel="canonical" href="https://www.shoil.ir/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="شهرام روغن" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:title" content="شهرام روغن | فروش عمده روغن موتور و روانکار" />
    <meta property="og:description" content="تأمین و فروش عمده‌ی روغن موتور، فیلتر، اسپری‌جات و اکتان برای فروشگاه‌های لوازم یدکی و اتوسرویس‌ها، با امکان پرداخت نقدی و چکی." />
    <meta property="og:url" content="https://www.shoil.ir/" />
    <meta property="og:image" content="https://www.shoil.ir/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="شهرام روغن — تأمین عمده‌ی روغن موتور و روانکار" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="شهرام روغن | فروش عمده روغن موتور و روانکار" />
    <meta name="twitter:description" content="تأمین و فروش عمده‌ی روغن موتور، فیلتر، اسپری‌جات و اکتان برای فروشگاه‌های لوازم یدکی و اتوسرویس‌ها، با امکان پرداخت نقدی و چکی." />
    <meta name="twitter:image" content="https://www.shoil.ir/og-image.png" />
    <!-- اتصال (DNS + TLS) به سرور API و عکس‌ها همزمان با دانلود JS باز می‌شه -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <!-- PWA: نصب سایت روی گوشی (اندروید و آیفون) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="شهرام روغن" />
    <script>
      // پیشنهاد نصب اندروید زود (قبل از لود React) می‌رسه؛ نگهش می‌داریم تا صفحه‌ی /app ازش استفاده کنه
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.__shoilInstallPrompt = event;
        window.dispatchEvent(new Event("shoil:installprompt"));
      });
      // Service Worker فقط در نسخه‌ی build (نه npm run dev)
      if ("%PROD%" === "true" && "serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
