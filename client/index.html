<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="%BRAND_THEME_COLOR%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO و پیش‌نمایش لینک: ثابت در HTML چون ربات‌های تلگرام/واتساپ/ایتا/بله جاوااسکریپت اجرا نمی‌کنن.
         مقدارهای BRAND_ موقع build از src/data/brand.js پر می‌شن (vite.config.js)؛
         عنوان و توضیح هر صفحه بعد از لود با hooks/usePageMeta عوض می‌شه -->
    <title>%BRAND_TITLE%</title>
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <link rel="canonical" href="%BRAND_SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:title" content="%BRAND_TITLE%" />
    <meta property="og:description" content="%BRAND_DESCRIPTION%" />
    <meta property="og:url" content="%BRAND_SITE_URL%/" />
    <meta property="og:image" content="%BRAND_OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%BRAND_NAME% — %BRAND_TAGLINE%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%BRAND_TITLE%" />
    <meta name="twitter:description" content="%BRAND_DESCRIPTION%" />
    <meta name="twitter:image" content="%BRAND_OG_IMAGE%" />
    <!-- اتصال (DNS + TLS) به سرور API و عکس‌ها همزمان با دانلود JS باز می‌شه.
         preconnect فقط origin می‌گیره (VITE_API_URL مسیر /api داره)؛ با عوض شدن دامنه‌ی API اینجا هم عوض بشه -->
    <link rel="preconnect" href="https://api.shoil.ir" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <!-- PWA: نصب سایت روی گوشی (اندروید و آیفون) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="%BRAND_NAME%" />
    <script>
      // حالت شب قبل از اولین رندر (بدون چشمک صفحه‌ی سفید)؛ همون قاعده‌ی services/preferenceStorage.js
      try {
        var savedTheme = localStorage.getItem("theme");
        if (savedTheme === "dark" || (!savedTheme && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (error) {}
      // پیشنهاد نصب اندروید زود (قبل از لود React) می‌رسه؛ نگهش می‌داریم تا صفحه‌ی /app ازش استفاده کنه
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.__shoilInstallPrompt = event;
        window.dispatchEvent(new Event("shoil:installprompt"));
      });
      // Service Worker فقط در نسخه‌ی build (نه npm run dev)
      if ("%PROD%" === "true" && "serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
