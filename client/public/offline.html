<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1b2d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>اتصال اینترنت برقرار نیست | شهرام روغن</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #f1f3f6;
        color: #152238;
        font-family: Vazirmatn, Vazir, Tahoma, "Segoe UI", sans-serif;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border-radius: 16px;
        padding: 32px 24px;
        box-shadow: 0 10px 30px rgba(15, 27, 45, 0.12);
      }
      img { width: 80px; height: 80px; border-radius: 18px; }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { color: #697386; line-height: 1.9; margin: 0 0 24px; }
      button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 14px;
        background: #faa61a;
        color: #0b1424;
        font: inherit;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1220; color: #f3f4f6; }
        .card { background: #152238; box-shadow: none; }
        p { color: #9ca3af; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="شهرام روغن" />
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>لطفاً اینترنت گوشی را بررسی کنید و دوباره تلاش کنید.<br />قیمت‌ها و موجودی فقط با اینترنت نمایش داده می‌شوند.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
    <script>
      // با وصل شدن دوباره‌ی اینترنت، خودکار صفحه رو دوباره لود کن
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
